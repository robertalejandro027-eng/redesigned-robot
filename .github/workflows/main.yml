<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Desktop & Repository Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b949e;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-[#0d1117] text-[#c9d1d9]">

    <!-- GitHub Application Header -->
    <header class="bg-[#161b22] border-b border-[#30363d] px-4 py-2.5 flex items-center justify-between select-none">
        <div class="flex items-center gap-3">
            <i class="fa-brands fa-github text-3xl text-white"></i>
            <span class="font-bold text-white text-base tracking-wide flex items-center gap-2">
                GitHub Hub
                <span class="text-xs bg-purple-900/50 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-mono">v2.5</span>
            </span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="createNewRepo()" class="bg-[#238636] hover:bg-[#2ea043] text-white font-medium text-xs px-3 py-1.5 rounded-md flex items-center gap-1.5 shadow transition">
                <i class="fa-solid fa-plus"></i> Novo Repositório
            </button>
            <div class="flex items-center gap-2 pl-3 border-l border-[#30363d]">
                <div class="w-8 h-8 rounded-full bg-purple-600 font-bold flex items-center justify-center text-xs text-white shadow">
                    GH
                </div>
                <div class="text-xs hidden sm:block">
                    <p class="font-semibold text-white leading-tight">dev-user</p>
                    <p class="text-[10px] text-emerald-400">● Conectado</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-[#161b22]/60 border-r border-[#30363d] p-3 flex flex-col justify-between select-none">
            <div class="space-y-4">
                <div class="p-3 bg-[#21262d] rounded-lg border border-[#30363d]">
                    <p class="text-xs font-semibold text-white mb-1"><i class="fa-solid fa-hard-drive text-blue-400 mr-1.5"></i> SSD Local (C:)</p>
                    <p class="text-[11px] text-gray-400">180 GB livres de 250 GB</p>
                    <div class="w-full bg-[#30363d] h-1.5 rounded-full mt-2 overflow-hidden">
                        <div class="bg-blue-500 h-full rounded-full" style="width: 28%;"></div>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="switchTab('repos')" id="tab-repos" class="w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 bg-purple-600/20 text-purple-300 font-semibold border border-purple-500/30 text-xs">
                        <i class="fa-solid fa-book-bookmark text-sm"></i> Repositórios
                    </button>
                    <button onclick="switchTab('commits')" id="tab-commits" class="w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 text-gray-400 hover:bg-[#21262d] transition text-xs">
                        <i class="fa-solid fa-code-commit text-sm"></i> Histórico de Commits
                    </button>
                    <button onclick="switchTab('clone')" id="tab-clone" class="w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 text-gray-400 hover:bg-[#21262d] transition text-xs">
                        <i class="fa-solid fa-cloud-arrow-down text-sm"></i> Clonar Repositório
                    </button>
                </nav>
            </div>

            <!-- Stats Footer -->
            <div class="p-3 bg-[#0d1117] rounded-lg border border-[#30363d] text-[11px] text-gray-400 space-y-1">
                <p><i class="fa-solid fa-code-branch text-purple-400"></i> Branch ativo: <strong class="text-gray-200">main</strong></p>
                <p><i class="fa-solid fa-check text-emerald-400"></i> Sincronizado com remoto</p>
            </div>
        </aside>

        <!-- Dynamic Content Panel -->
        <main class="flex-1 bg-[#0d1117] flex flex-col overflow-hidden">
            
            <!-- VIEW: REPOSITORIES -->
            <section id="view-repos" class="p-6 flex-1 overflow-y-auto space-y-4">
                <div class="flex items-center justify-between border-b border-[#30363d] pb-3">
                    <div>
                        <h2 class="text-lg font-bold text-white">Seus Repositórios</h2>
                        <p class="text-xs text-gray-400">Projetos salvos e sincronizados localmente</p>
                    </div>
                    <input type="text" id="search-repo" oninput="filterRepos()" placeholder="Buscar repositório..." class="bg-[#161b22] border border-[#30363d] rounded-lg px-3 py-1.5 text-xs text-white outline-none focus:border-purple-500 w-64">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="repo-container">
                    <!-- Populated via JavaScript -->
                </div>
            </section>

            <!-- VIEW: COMMITS -->
            <section id="view-commits" class="p-6 flex-1 overflow-y-auto hidden space-y-4">
                <div class="border-b border-[#30363d] pb-3">
                    <h2 class="text-lg font-bold text-white">Histórico Recente de Commits</h2>
                    <p class="text-xs text-gray-400">Atividades e alterações recentes enviadas ao repositório</p>
                </div>
                <div class="space-y-2.5 text-xs" id="commit-container">
                    <!-- Populated via JavaScript -->
                </div>
            </section>

            <!-- VIEW: CLONE -->
            <section id="view-clone" class="p-6 flex-1 overflow-y-auto hidden">
                <div class="border-b border-[#30363d] pb-3 mb-4">
                    <h2 class="text-lg font-bold text-white">Clonar Repositório Remoto</h2>
                    <p class="text-xs text-gray-400">Baixe um repositório do GitHub para o SSD local</p>
                </div>
                
                <div class="max-w-xl space-y-4 bg-[#161b22] p-5 rounded-xl border border-[#30363d]">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1.5">URL do Repositório GitHub (.git)</label>
                        <input type="text" id="clone-url-input" placeholder="https://github.com/usuario/projeto.git" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-xs text-white outline-none focus:border-purple-500">
                    </div>
                    <button onclick="cloneRepository()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-lg font-medium shadow flex items-center gap-2 transition">
                        <i class="fa-solid fa-download"></i> Executar git clone
                    </button>
                    <div id="clone-status" class="p-3 bg-[#0d1117] rounded-lg border border-emerald-500/30 text-xs text-emerald-400 hidden flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch animate-spin"></i>
                        <span id="clone-status-text">Processando...</span>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        // Data Structures
        let repositories = [
            { name: "hinos-harpa-crista-app", stars: 142, lang: "JavaScript", desc: "Player e acervo completo de hinos evangélicos para Web e Desktop.", visibility: "Público" },
            { name: "windows-pc-simulator", stars: 89, lang: "HTML/Tailwind", desc: "Simulador de sistema operacional de 250 GB com gerenciamento de arquivos.", visibility: "Público" },
            { name: "harpa-api-rest", stars: 34, lang: "TypeScript", desc: "API RESTful para buscar letras e cifras de hinos cristãos.", visibility: "Privado" },
            { name: "react-components-library", stars: 56, lang: "TypeScript", desc: "Biblioteca de componentes de interface para React e Tailwind CSS.", visibility: "Público" }
        ];

        let commits = [
            { hash: "8f3a1d2", msg: "feat: adicionado suporte ao GitHub Desktop no PC", author: "dev-user", time: "há 10 min" },
            { hash: "4e9b7c1", msg: "fix: corrigido player de hinos com Web Audio API", author: "dev-user", time: "há 2 horas" },
            { hash: "1a2b3c4", msg: "init: estrutura inicial do SO de 250 GB", author: "dev-user", time: "ontem" },
            { hash: "9z8y7x6", msg: "docs: atualizado README com instruções de instalação", author: "dev-user", time: "há 2 dias" }
        ];

        function renderRepos(filterText = '') {
            const container = document.getElementById('repo-container');
            container.innerHTML = '';

            const filtered = repositories.filter(r => r.name.toLowerCase().includes(filterText.toLowerCase()));

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 col-span-2 py-4 text-center">Nenhum repositório encontrado.</p>`;
                return;
            }

            filtered.forEach(repo => {
                const card = document.createElement('div');
                card.className = "p-4 bg-[#161b22] rounded-xl border border-[#30363d] hover:border-purple-500/50 transition flex flex-col justify-between space-y-3";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-book text-purple-400 text-xs"></i>
                                <span class="font-bold text-sm text-purple-300 hover:underline cursor-pointer">${repo.name}</span>
                            </div>
                            <span class="text-[10px] border border-[#30363d] text-gray-400 px-2 py-0.5 rounded-full">${repo.visibility}</span>
                        </div>
                        <p class="text-xs text-gray-400 leading-relaxed">${repo.desc}</p>
                    </div>
                    <div class="flex items-center justify-between text-xs pt-2 border-t border-[#30363d]/50 text-gray-400">
                        <div class="flex items-center gap-4">
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block"></span> ${repo.lang}</span>
                            <span class="flex items-center gap-1"><i class="fa-regular fa-star text-amber-400"></i> ${repo.stars}</span>
                        </div>
                        <span class="text-[10px] bg-[#21262d] text-emerald-400 px-2 py-0.5 rounded font-mono">Clonado (C:)</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderCommits() {
            const container = document.getElementById('commit-container');
            container.innerHTML = '';
            commits.forEach(c => {
                const item = document.createElement('div');
                item.className = "p-3 bg-[#161b22] rounded-lg border border-[#30363d] flex items-center justify-between hover:border-gray-600 transition";
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-code-commit text-purple-400 text-sm"></i>
                        <div>
                            <p class="font-medium text-white text-xs">${c.msg}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">${c.author} • ${c.time}</p>
                        </div>
                    </div>
                    <span class="font-mono text-[11px] bg-[#21262d] text-purple-300 px-2.5 py-1 rounded border border-[#30363d]">${c.hash}</span>
                `;
                container.appendChild(item);
            });
        }

        function filterRepos() {
            const query = document.getElementById('search-repo').value;
            renderRepos(query);
        }

        function switchTab(tab) {
            ['repos', 'commits', 'clone'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                if (btn) {
                    btn.className = "w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 text-gray-400 hover:bg-[#21262d] transition text-xs";
                }
            });

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.className = "w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 bg-purple-600/20 text-purple-300 font-semibold border border-purple-500/30 text-xs";
            }
        }

        function createNewRepo() {
            const repoName = prompt("Digite o nome do novo repositório GitHub:");
            if (repoName && repoName.trim() !== '') {
                repositories.unshift({
                    name: repoName.toLowerCase().trim().replace(/\s+/g, '-'),
                    stars: 0,
                    lang: "JavaScript",
                    desc: "Novo repositório criado no GitHub Hub.",
                    visibility: "Público"
                });
                renderRepos();
                switchTab('repos');
            }
        }

        function cloneRepository() {
            const input = document.getElementById('clone-url-input').value;
            const statusBox = document.getElementById('clone-status');
            const statusText = document.getElementById('clone-status-text');

            if (!input.trim()) return;

            statusBox.classList.remove('hidden');
            statusText.textContent = "Clonando repositório para o diretório C:/GitHub/...";

            setTimeout(() => {
                const extractedName = input.split('/').pop().replace('.git', '') || 'novo-repo-clonado';
                repositories.unshift({
                    name: extractedName,
                    stars: 1,
                    lang: "Python",
                    desc: "Repositório clonado via URL remota.",
                    visibility: "Público"
                });
                statusText.textContent = "✔ Repositório clonado com sucesso!";
                renderRepos();
                setTimeout(() => {
                    document.getElementById('clone-url-input').value = '';
                    switchTab('repos');
                }, 1000);
            }, 1200);
        }

        window.onload = function() {
            renderRepos();
            renderCommits();
        };
    </script>
</body>
</html>
